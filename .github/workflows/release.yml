name: release
on:
  push:
    tags:
      - '*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for creating releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull LaTeX toolchain
        run: docker pull blang/latex:ubuntu

      - name: Compile LaTeX
        run: ./scripts/compile.sh

      - name: Prepare files
        run: |
          mkdir -p out
          cp build/wouter_dankers_cv.pdf out/
          cp build/wouter_dankers_portfolio.pdf out/
          zip -j out/wouter_dankers.zip out/wouter_dankers_cv.pdf out/wouter_dankers_portfolio.pdf

      # Creates the release for the pushed tag and uploads assets in one go
      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/wouter_dankers.zip
            out/wouter_dankers_cv.pdf
            out/wouter_dankers_portfolio.pdf
          draft: false
          prerelease: false
